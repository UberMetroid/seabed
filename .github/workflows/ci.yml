name: CI & EGO Bundle Verification

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verification Ladder & Official EGO Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNOME Shell & EGO validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gnome-shell-common gnome-shell gir1.2-adw-1 gir1.2-gtk-4.0 gjs libxml2-utils jq unzip pipx

      - name: Validate GSettings XML schema
        run: |
          xmllint --noout extension/schemas/*.xml
          glib-compile-schemas --strict --dry-run extension/schemas

      - name: Run zero-dependency GJS architectural & headless behavioral test suite
        run: gjs -m tests/verify.js

      - name: Pack EGO extension zip bundle
        run: |
          mkdir -p dist
          gnome-extensions pack extension \
            --force \
            --out-dir=dist \
            --schema=schemas/org.gnome.shell.extensions.seabed.gschema.xml \
            --extra-source=desktop \
            --extra-source=ui
          unzip -l dist/seabed@ubermetroid.github.io.shell-extension.zip

      - name: Run shexli EGO static review analyzer (0 errors, 0 warnings)
        run: |
          pipx run shexli dist/seabed@ubermetroid.github.io.shell-extension.zip

      - name: Official EGO Review Gate (Metadata, Zip Audit, & gnome-extensions install)
        run: |
          set -euo pipefail
          ZIP="dist/seabed@ubermetroid.github.io.shell-extension.zip"

          echo "==> 1. Validating metadata.json required EGO fields..."
          jq -e '.uuid == "seabed@ubermetroid.github.io" and .name == "Seabed" and (.["shell-version"] | length >= 1) and .["settings-schema"] == "org.gnome.shell.extensions.seabed"' extension/metadata.json >/dev/null

          echo "==> 2. Auditing .shell-extension.zip for EGO forbidden files..."
          CONTENTS="$(unzip -Z1 "$ZIP")"
          echo "$CONTENTS" | grep -qx "extension.js"
          echo "$CONTENTS" | grep -qx "prefs.js"
          echo "$CONTENTS" | grep -qx "metadata.json"
          echo "$CONTENTS" | grep -qx "schemas/org.gnome.shell.extensions.seabed.gschema.xml"
          if echo "$CONTENTS" | grep -E '(gschemas\.compiled|\.git|\.po$|\.pot$|\.rs$|Cargo\.|node_modules|package\.json)'; then
            echo "ERROR: Forbidden file found inside EGO zip archive!"
            exit 1
          fi

          echo "==> 3. Scanning JS modules for EGO review-guideline violations..."
          if grep -rnE '(ByteArray\.toString|imports\.mainloop|imports\.lang|ExtensionUtils|spawn_command_line_sync|spawn_sync|\beval\s*\(|new Function\s*\()' extension/; then
            echo "ERROR: Forbidden EGO pattern found in extension/"
            exit 1
          fi

          echo "==> 4. Testing installation via official gnome-extensions CLI..."
          gnome-extensions install --force "$ZIP"
          test -f "$HOME/.local/share/gnome-shell/extensions/seabed@ubermetroid.github.io/extension.js"
          test -f "$HOME/.local/share/gnome-shell/extensions/seabed@ubermetroid.github.io/metadata.json"

      - name: Upload EGO extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: seabed-shell-extension-zip
          path: dist/seabed@ubermetroid.github.io.shell-extension.zip
